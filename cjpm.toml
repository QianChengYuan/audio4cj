# ============================================================================
# audio4cj —— 仓颉统一音频解析库
#   文档：docs/quickstart.md、docs/api/      许可证：Apache-2.0（见 LICENSE / NOTICE）
#
#   解码全部为纯仓颉实现：WAV（位深转换）、FLAC（帧解码 + CRC-8/16 + SEEKTABLE）、
#   Ogg 封装的 FLAC（页重组 + 页 CRC-32）。MP3 不在解码范围内 —— 容器仍可识别、
#   ID3 标签仍可读，但不解码。
# ============================================================================

[package]
  name = "audio4cj"
  cjc-version = "1.2.0"
  version = "0.1.2"
  output-type = "static"
  description = "仓颉统一音频解析库：探测容器格式，解码为统一的 f32 交错 PCM，并提取统一的标签模型"

  # —— 中心仓元数据（随 meta-data.json 上架展示）——
  authors = ["yuan_1992"]
  license = ["Apache-2.0"]                                    # 须为 SPDX Identifier
  repository = "https://gitcode.com/yuan_1992/audio4cj"
  homepage = "https://gitcode.com/yuan_1992/audio4cj"
  documentation = "https://gitcode.com/yuan_1992/audio4cj/blob/main/README.md"
  tag = ["audio", "flac", "mp3", "wav", "decoder"]            # 上限 5 项
  category = ["Audio and Video"]                              # 取自 cjpm 内置枚举

  # —— 打包范围：白名单（fail-closed）——
  # 规则须用前导斜杠锚定到仓库根目录：不带斜杠的规则在任意层级生效，
  # 会把 tools/*/src/ 这类同名目录一并捞进制品包（实测教训）。
  include = [
    "/src/*.cj",      # 根包文件（有子包时，各父包都必须直接含 .cj 文件）
    "/src/codec",
    "/src/core",
    "/src/facade",
    "/src/format",
    "/src/meta",
    "/src/pcm",
    "/src/probe",
    "/src/stream",
    "/src/test",      # 测试源码：包内用例**自足**，不依赖任何外部素材
    "/docs",          # 面向使用者的公开文档
    # 注：/config（cjlint 规则集）**不随包** —— 它只服务于仓库侧 CI，
    # 与四个已上架同类包的形态一致（它们也都只有 src + 文档 + 许可证）。
    "/LICENSE",
    "/LICENSES.md",
    "/NOTICE"
  ]

  # —— 不随包分发 ——
  # 下列用例依赖仓库内的 testdata/ 语料与 ffmpeg 基准（cjpm 不打包二进制素材），
  # 随包只会变成跑不起来的用例。它们仍留在仓库中，由仓库侧的 cjpm test 全量运行；
  # 包内的功能验证由自足用例承担（src/test/selfcontained_*_test.cj）。
  exclude = [
    "/src/test/bench_decode_test.cj",
    "/src/test/facade_format_test.cj",
    "/src/test/flac_bitstream_test.cj",
    "/src/test/flac_crc_test.cj",
    "/src/test/flac_frame_test.cj",
    "/src/test/flac_meta_test.cj",
    "/src/test/flac_seektable_test.cj",
    "/src/test/golden_support_test.cj",
    "/src/test/golden_test.cj",
    "/src/test/long_run_test.cj",
    "/src/test/mp4_tags_test.cj",
    "/src/test/ogg_crc_test.cj",
    "/src/test/ogg_tags_test.cj",
    "/src/test/probe_matrix_test.cj",
    # 内部工程文档（发布流程、编解码扩展评估）：保留在仓库，不发往制品页。
    "/docs/release.md",
    "/docs/codec-expansion-assessment.md",
    "*.bak",          # 防御性：备份、编译中间产物与动态库一律不进包
    "*.cjo",
    "*.dll",
    "*.so",
    "*.dylib"
  ]

# Linux/ELF 专有的链接加固选项。必须放在 [target] 节：写进 [package] 会让
# Windows 的链接器直接报 `unknown argument: -z`（实测教训）。
[target.x86_64-unknown-linux-gnu]
  link-option = "-z noexecstack -z relro -z now"
