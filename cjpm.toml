# ============================================================================
# audio4cj —— 仓颉统一音频解析库
# 文档：docs/README.md
# 许可证：Apache-2.0（见 LICENSE / NOTICE / LICENSES.md）
#
# 解码实现分工：
#   WAV             —— 纯仓颉实现（未压缩容器，其「解码」本质是位深转换，
#                      不含浮点 DSP）
#   FLAC / MP3      —— 经 dr_libs 的 FFI 接入
#   Ogg 封装的 FLAC —— 同上（dr_flac 原生支持，与原生 FLAC 共用同一读取器）
# dr_libs 的 WAV 通路保留作交叉验证基准。
# ============================================================================

[package]
  name = "audio4cj"
  cjc-version = "1.2.0"
  version = "0.1.0"
  output-type = "static"
  description = "仓颉统一音频解析库：探测容器格式，解码为统一的 f32 交错 PCM，并提取统一的标签模型"
  # —— 中心仓元数据（发布时展示在制品页；规格与实测依据见 docs/release.md 的「发布元数据」章节）——
  # 这些字段会进入 target/meta-data.json，即随制品上传、供仓库端入库检查的元数据。
  authors = ["yuan_1992"]
  # license 取值须遵循 SPDX Identifier 规范（官方要求）。
  license = ["Apache-2.0"]
  # repository / homepage 均指向 GitCode：以它为对外主仓。
  # 本字段**不参与任何构建** —— CI 仍跑在 GitHub，两者互不影响。
  repository = "https://gitcode.com/yuan_1992/audio4cj"
  homepage = "https://gitcode.com/yuan_1992/audio4cj"
  # documentation 用**网页视图** /blob/ 而非纯文本 /raw/：官方字段语义是"制品文档页 url"。
  # 实测 /blob/main/README.md 与 /raw/main/README.md 均返回 200，取前者。
  documentation = "https://gitcode.com/yuan_1992/audio4cj/blob/main/README.md"
  # 【tag 上限 5 项】cjpm 内含校验文案 `Error: size of field 'tag' cannot be over ...`
  # （相邻工程 winsound4cj 实测报错为 "...cannot be over 5"）。本列表恰好 5 项，不可再增。
  tag = ["audio", "flac", "mp3", "wav", "decoder"]
  # 【category 取自官方枚举，不是自造词】cjpm 内置该枚举（二进制中可见符号
  # `cjpm.config.CATEGORY_SET`），"Audio and Video" 是其中一项。
  # 实测要点：写小写 "audio and video" 同样被接受，cjpm 会**归一化**为该规范写法
  # （生成的 meta-data.json 里是 "Audio and Video"），故此处直接写规范形式。
  # 枚举的提取方法与局限见 docs/release.md；合法性最终由 cjpm bundle 兜底校验，
  # 故不在此重复实现枚举 —— 那会制造第二份真相。
  category = ["Audio and Video"]

  # 打包范围（cjpm 官方机制，见 docs/release.md）。
  #
  # 【为什么只用 include 白名单，不用 exclude 黑名单】
  #   两者都是 gitignore 格式的规则数组，但失效方向相反：
  #     黑名单漏一项 ⇒ 多打包 ⇒ **危险**（可能把不该发布的发布出去）
  #     白名单漏一项 ⇒ 少打包 ⇒ 安全（fail-closed）
  #   最典型的场景：将来新增一个顶层目录时，白名单不会自动把它发布出去。
  #
  # 【为什么需要它：.gitignore 管不住 cjpm bundle】
  #   bundle 打包的是文件系统而非 git 索引。实测未配置本字段时，制品包里
  #   出现了 736 个条目，其中含内部设计留痕 开发文档/、已废弃的 tools/cjbind/、
  #   m0-poc/、musics/ 等。加上白名单后为 130+ 条目，且经脚本逐项校验。
  #
  # 【官方默认规则（与本字段无关）】
  #   默认必打包：根目录的 cjpm.toml、README.md、README_zh.md
  #   默认不打包：根目录的 cjpm.lock、cangjie-repo.toml、编译产物目录、
  #               构建脚本产物目录、**所有二进制文件**
  #   （后者解释了 libs/ 与 tools/Releases/ 下的二进制从不进包。）
  #
  # 【为什么必须有 third-party，且为什么只取其中的几个文件】
  #   消费者侧要用它现场编译 C 库（见 build.cj 与 docs/release.md）。
  #   而 drlibs_wrapper.c 只 include 三个**单头文件**库，因此构建真正需要的只有：
  #       drlibs_wrapper.c + dr_flac.h / dr_mp3.h / dr_wav.h + LICENSE + README.md
  #
  #   刻意不含 dr_libs 原仓库的 tests/ 与 fuzzer（*.c / *.cpp / *_fuzzer.cc）：
  #   构建完全用不到它们，而 fuzzer 是"专门让程序崩溃"的代码 ——
  #   放进制品包对审阅者只有负面意义。0.1.0 首次提交上架审核被退回，
  #   在拿到官方说明前，先把这类可疑内容清出去（详情见 docs/release.md）。
  #
  #   ⚠ 将来新增 C 源文件（例如换用别的库）时，**必须把它的路径同步加进下面的
  #     include** —— 白名单漏写即少打包，而消费者要现场编译它，会因缺文件而失败。
  #
  # 【规则必须用前导斜杠锚定到仓库根目录】
  #   include/exclude 遵循 gitignore 匹配语义，而 gitignore 中**不带斜杠**的
  #   规则会在任意层级生效。实测教训：规则写成 "src" 时，
  #   tools/cjbind/cjbind/cjbind/src/ 与 m0-poc/src/ 被一并捞进了制品包
  #   （共 112 项）—— 只因它们的目录名也叫 src。
  #   加前导斜杠后锚定到根目录，只匹配根下的同名项。
  include = [
    "/src",           # 库源码
    "/config",        # 项目级 cjlint 规则集
    "/docs",          # 面向使用者的公开文档
    "/build.cj",      # 构建期装配 C 库的钩子 —— 消费者侧就靠它
    "/LICENSE",
    "/LICENSES.md",
    "/NOTICE",
    # —— third-party：只取构建真正需要的那几个文件（理由见上方注释）——
    "/third-party/drlibs_wrapper.c",
    "/third-party/dr_libs/dr_flac.h",
    "/third-party/dr_libs/dr_mp3.h",
    "/third-party/dr_libs/dr_wav.h",
    "/third-party/dr_libs/LICENSE",
    "/third-party/dr_libs/README.md"
  ]

# C 库依赖：dr_libs 的**静态库**（dr_wav + dr_flac + dr_mp3 三种实现置于同一
# 翻译单元，三者符号前缀互不冲突，实测可共存）。
#
# 【为什么改成静态库】
#   动态库要求**消费者运行期**也能加载到它（Windows 上还要操心 lib 前缀双副本
#   这类规格问题）。改静态后 C 库直接进可执行文件，运行期不再有额外要求；
#   代价可忽略 —— 整个 dr_libs 封装静态进来约 225 KB（实测）。
#   实测依据：ffi 目录里只放 libdrlibs.a、不含任何 DLL 时，消费者构建成功，
#   bin/ 中无 DLL，程序运行正常。
#
# 【按平台分别指向：cjpm 的 target 级 [ffi.c]（2026-10-03 实测可用）】
#   此前这里固定指向 libs/current/，再由 build.cj「按平台把产物拷进去」，
#   依据是「[ffi.c] 的路径是静态配置、无法按目标平台切换」——**该判断是错的**：
#   cjpm 支持 [target.<三元组>.ffi.c]，因此中间层与拷贝步骤都不再需要。
#   三元组取自各平台 `cjc --version` 打印的 Target 行（CI 日志可复核）。
#
#   这样做的实际收益：Windows 的 libs/windows_x86_64/ 里**预置了产物**（入库），
#   所以全新克隆后 `cjpm check` 直接通过，不必再「先 build 后 check」。
#   Linux / macOS 没有预置产物（本机无法交叉编译），仍需 build 在前。
#
#   ⚠ 注意作用范围：上面这条豁免**只对「仓库内」成立**。cjpm 从不把二进制打进
#     制品包，因此消费者拿到的包里没有任何 libs/ —— **制品包内所有平台**都需
#     先 build 后 check。「把产物也入库即可消除该约束」对制品包不适用，
#     成因与两次实测见 build.cj 文件头。
[target.x86_64-w64-mingw32.ffi.c]
  drlibs = { path = "./libs/windows_x86_64/" }

[target.x86_64-unknown-linux-gnu.ffi.c]
  drlibs = { path = "./libs/linux_x86_64/" }

[target.aarch64-apple-darwin.ffi.c]
  drlibs = { path = "./libs/macos_aarch64/" }

[target.x86_64-apple-darwin.ffi.c]
  drlibs = { path = "./libs/macos_x86_64/" }

# 链接安全加固。
#
# 注意：`-z noexecstack -z relro -z now` 是 Linux/ELF 专有选项，
# Windows 的 lld 链接 PE 目标时不支持 -z 参数，若写在 [package] 里全局生效
# 会导致 Windows 构建直接失败（lld: error: unknown argument: -z）。
# 因此平台相关链接选项必须放进对应的 [target] 节。
# （实测教训见开发文档 §6.2 与 §12.4）
[target.x86_64-unknown-linux-gnu]
  link-option = "-z noexecstack -z relro -z now"
