# ============================================================================
# audio4cj —— 仓颉统一音频解析库
#   文档：docs/quickstart.md、docs/api/      许可证：Apache-2.0（见 LICENSE / NOTICE）
#
#   解码全部为纯仓颉实现：WAV（位深转换）、FLAC（帧解码 + CRC-8/16 + SEEKTABLE）、
#   MP3（帧同步 + Huffman + IMDCT + 多相合成滤波）、
#   Ogg 封装的 FLAC（页重组 + 页 CRC-32）。
# ============================================================================

[package]
  name = "audio4cj"
  cjc-version = "1.2.0"
  version = "0.1.4"
  output-type = "static"
  description = "仓颉统一音频解析库：探测容器格式，解码为统一的 f32 交错 PCM，并提取统一的标签模型"

  # unused 组警告的官方抑制开关（cjc 在每个该组告警下都会提示 `-Woff unused`）。
  # 测试代码经 @Test 宏展开后会产生大量 "unreachable block in 'if' expression"
  # 与 unused 变量/导入告警（本地实测 341 条），会把真实告警淹没。此类告警不改变
  # 产物语义，故统一关闭；产品代码在本开关前后均为零告警（实测）。
  compile-option = "-O2 -Woff unused"

  # —— 中心仓元数据（随 meta-data.json 上架展示）——
  authors = ["yuan_1992"]
  license = ["Apache-2.0"]                                    # 须为 SPDX Identifier
  repository = "https://gitcode.com/yuan_1992/audio4cj"
  homepage = "https://gitcode.com/yuan_1992/audio4cj"
  documentation = "https://gitcode.com/yuan_1992/audio4cj/blob/main/README.md"
  tag = ["audio", "flac", "mp3", "wav", "decoder"]            # 上限 5 项
  category = ["Audio and Video"]                              # 取自 cjpm 内置枚举

  # —— 打包范围：白名单（fail-closed）——
  # 规则须用前导斜杠锚定到仓库根目录：不带斜杠的规则在任意层级生效，
  # 会把 tools/*/src/ 这类同名目录一并捞进制品包（实测教训）。
  #
  # 交付**产品代码 + 公开文档 + 许可证 + 测试源码的自足子集**。制品包是源码包，
  # 使用者解包后会直接 `cjpm test`，所以测试源码只有一条取舍判据 —— **要不要素材**：
  #   · 自足用例随包：输入在运行时现场构造，不依赖任何外部素材，解包即可跑通；
  #   · 依赖语料的用例不随包：它们要 testdata/ 或 musics/，而 cjpm 官方规则
  #     「所有二进制文件默认不打包」，素材根本进不去 —— 留在包内只会变成守卫
  #     静默跳过的死用例（实测过一次"包内 206 通过、其中 42 条一行都没跑"的假绿）。
  include = [
    "/src/*.cj",      # 根包文件（有子包时，各父包都必须直接含 .cj 文件）
    "/src/codec",
    "/src/core",
    "/src/facade",
    "/src/format",
    "/src/meta",
    "/src/pcm",
    "/src/probe",
    "/src/stream",
    # 测试源码：只白名单**纯内存、零副作用**的用例，逐文件登记（而非放行整个 /src/test）。
    # 两条判据（缺一不进包）：
    #   ① 不要素材：源码**去掉注释后**不出现 testdata / musics，也不调用素材守卫
    #      gsSkipIfNoFixtures —— 即"解包后不需要任何素材就能真实跑通"；
    #   ② 不落盘、不生成二进制：不写临时素材（不调用 test_scratch.cj 的 testTmpPath）。
    #      "就地构造素材再落盘"的用例（自足端到端、CRC 校验与损坏样本回归、
    #      随机输入回归、WAV 写回读）对消费者无必要，且要求可写目录 ——
    #      一律留在仓库，由仓库侧 `cjpm test` 全量运行。
    # 逐文件登记的好处是 fail-closed：新增用例默认**不**进包，要随包必须在此显式登记；
    # 反向断言见 scripts/release_bundle.py 的 FORBIDDEN 与「测试素材依赖检查」。
    # （实测教训：写成「include /src/test + exclude 若干具体文件」会让 cjpm bundle
    #  在打包阶段 OOM；`--skip-lint` 也一样，整目录排除则不触发 —— 故不采用那种写法。）
    "/src/test/audio_buffer_test.cj",
    "/src/test/audio_file_test.cj",
    "/src/test/exception_test.cj",
    "/src/test/flac_bits_test.cj",
    "/src/test/flac_perf_micro_test.cj",
    "/src/test/frame_stream_test.cj",
    "/src/test/id3v1_test.cj",
    "/src/test/id3v2_test.cj",
    "/src/test/mp3_synth_micro2_test.cj",
    "/src/test/mp3_synth_micro_test.cj",
    "/src/test/registry_test.cj",
    "/src/test/tag_test.cj",
    "/src/test/vorbis_comment_test.cj",
    "/src/test/wav_info_test.cj",
    "/docs",          # 面向使用者的公开文档（仓库内部文档见 exclude）
    "/LICENSE",
    "/LICENSES.md",
    "/NOTICE",
    # 根目录只有 cjpm.toml / README.md / README_zh.md 属于「无论 include/exclude
    # 都会打包」的自动项（cjpm 官方规则），其余根文件必须显式列入白名单，
    # 否则会被静默丢掉 —— 而这两项正是中心仓三方库模板的根目录标准组成文件。
    "/CHANGELOG.md",
    "/README.OpenSource"
  ]

  # —— 不随包分发 ——
  # 注：依赖语料的测试用例不在这里列 —— 它们由 include 白名单天然拦住（白名单只
  # 登记自足子集），此处只放**目录级**的排除项，避免"目录 include + 文件 exclude"
  # 那种写法（实测会让 cjpm bundle 在打包阶段 OOM）。
  exclude = [
    # 仓库侧静态检查配置（cjlint 规则集）只服务于 CI，与已上架同类包形态一致。
    "/config",
    # 内部工程文档（发布流程、编解码扩展评估、解码偏差定位评估）：
    # 保留在仓库，不发往制品页。
    "/docs/release.md",
    "/docs/codec-expansion-assessment.md",
    "/docs/decode-deviation-localization-evaluation.md",
    "*.bak",          # 防御性：备份、编译中间产物与动态库一律不进包
    "*.cjo",
    "*.dll",
    "*.so",
    "*.dylib"
  ]

# Linux/ELF 专有的链接加固选项。必须放在 [target] 节：写进 [package] 会让
# Windows 的链接器直接报 `unknown argument: -z`（实测教训）。
[target.x86_64-unknown-linux-gnu]
  link-option = "-z noexecstack -z relro -z now"
