# ============================================================================
# audio4cj 示例工程 —— 独立可运行工程
#
# 它是一个**独立模块**，通过 path 依赖引入仓库根目录的 audio4cj，
# 因此它同时也是一份"消费者视角"的用法示例：
#   依赖怎么声明、构建期与运行期有什么要求。
#
# 运行方式见 README.md。
# ============================================================================

[package]
  name = "audio4cj_examples"
  cjc-version = "1.2.0"
  version = "0.0.1"
  output-type = "executable"
  description = "audio4cj 的可运行示例（默认展示流式用法）"

[dependencies]
  # 相对本文件所在目录：examples/ 的上一级即仓库根（audio4cj/）。
  # 用相对路径而非绝对路径，别人克隆后无需改动即可构建。
  audio4cj = { path = ".." }
