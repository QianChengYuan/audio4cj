# ============================================================
# audio4cj CodeQL —— 安全扫描
# ------------------------------------------------------------
# 覆盖：
#   - Python（sctiptr/*.py）：测试素材与 golden 基准的生成脚本 —— 它们是**历史实现**，
#     现行来源是 scripts/gen_testdata.sh 与 scripts/gen_testdata.ps1（shell / PowerShell，
#     CodeQL 不覆盖这两种语言）；扫描 sctiptr/ 是因为那是仓库里仅有的 Python
#
# 不覆盖：
#   - 仓颉 .cj：CodeQL 不支持该语言，由 cjlint 替代（见 ci-lint.yml）
#   - C/C++：**本库已不含任何 C 代码**。原先扫的是
#     third-party/drlibs_wrapper.c（本项目自己写的 C 侧薄封装，位于 FFI 边界），
#     它已随 C 依赖整体移除，因此这里也不再保留 cpp 作业 ——
#     留一个"无事可扫的作业"比删掉更糟：它会让构建步骤引用的文件缺失，
#     从而把整个工作流变红。
#
# 触发：
#   - push main / PR main：扫描当前代码
#   - schedule：每周一 02:00 UTC 跑一次，捕获新增规则
#
# 【关于阻断策略】
#   本工作流**不内置自定义阻断门禁**：结果上传到 Security 标签页，
#   由仓库的分支保护规则决定是否阻断。这样做的原因是：
#   自定义 SARIF 解析脚本本身需要维护与自测，而它的判定口径
#   （哪些严重度该阻断）属于仓库策略，不宜写死在 CI 文件里。
# ============================================================

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write  # 上传 SARIF 到 Security 标签页

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build_mode: none

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
