# ============================================================
# audio4cj 发布打包 —— 打包 → 校验 → 上传制品
# ------------------------------------------------------------
# 触发：手动 workflow_dispatch，或推送 v* 标签。
#
# 【打包范围由 cjpm.toml 的 include 白名单决定】
#   `cjpm bundle` 打包的是**文件系统**而非 git 索引，.gitignore 对它无效 ——
#   未配置范围时实测包里会出现内部设计留痕 开发文档/、已废弃的 tools/cjbind/、
#   m0-poc/ 等（共 736 个条目）。现在 cjpm.toml 用 [package].include 白名单圈定
#   范围，并由 scripts/release_bundle.py 逐项校验包内容（必需的必须有、
#   禁止的必须没有）。完整说明见 docs/release.md。
#
# 【为什么这里不再需要 clang】
#   本库已无任何 C 依赖：打包过程中 `cjpm test` 要跑的用例全部是纯仓颉实现，
#   不需要链接任何 C 库。（此前这里装 clang 是因为 [ffi.c] 指向的静态库不在包内、
#   需要 build.cj 现场编译 —— 那套机制已随 C 依赖整体移除。）
#
# 【为什么在 Linux 上打包】
#   包本身与平台无关（纯源码 + 配置）。选 Linux 是因为它是最"干净"的环境 ——
#   若包内容有任何自洽性问题，最能暴露出来。包内只随发**纯内存用例**（不依赖素材、
#   不写盘），因此包内 `cjpm test` 全部真实执行、**不需要任何跳过**；依赖语料与会写盘的
#   用例都留在仓库侧运行 —— 素材是二进制，本就不随包分发（见 docs/release.md）。
# ------------------------------------------------------------

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # 与 cjpm.toml 的 cjc-version 保持一致（最低声明版本；2026-10-10 起为 1.1.0）
  CANGJIE_VERSION: "1.1.0"

jobs:
  bundle:
    name: 打包并校验
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 安装仓颉 SDK ${{ env.CANGJIE_VERSION }}
        uses: ./.github/actions/setup-cangjie
        with:
          os: linux
          version: ${{ env.CANGJIE_VERSION }}
          url-override: ${{ vars.CANGJIE_SDK_URL_LINUX }}

      # 工作区干净是硬要求：include 按路径生效，落在打包范围内的**未跟踪**文件
      # 同样会被打进包，因此必须先确认没有未提交内容（脚本会拒绝执行）
      - name: 确认工作区干净
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::工作区有未提交改动，拒绝打包"
            exit 1
          fi

      - name: 生成发布包（含包内容校验）
        run: python3 scripts/release_bundle.py

      # 制品先留在 Actions 里人工核对，再由维护者执行 cjpm publish
      # （publish 不可逆，刻意不放进 CI）
      - name: 上传制品
        uses: actions/upload-artifact@v4
        with:
          name: audio4cj-cjp
          path: target/release-artifacts/*.cjp
          if-no-files-found: error
