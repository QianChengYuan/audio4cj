# ============================================================
# audio4cj CI —— 三平台无人值守门禁
# ------------------------------------------------------------
# 触发：push / PR 到 main（仅源码与构建相关变更），以及手动 workflow_dispatch。
# 平台：
#   - Linux x64   (ubuntu-24.04)
#   - Windows x64 (windows-2022)
#   - macOS arm64 (macos-14, Apple Silicon)
#
# 流程：缓存 → 仓颉 SDK → cjpm build → cjpm check → cjpm test
#
# 【三个平台的步骤为什么几乎一样】
#   构建链路上没有任何平台相关的 C 步骤：解码全部为纯仓颉实现。
#   曾经那套"由 build.cj 按平台准备 C 静态库"的机制已随 C 依赖整体移除，
#   因此这里既不需要 C 编译器，也不再有"先 build 后 check"的顺序约束。
#
# 【测试不需要 ffmpeg】
#   golden PCM 基准已随仓库入库，而"无损互证"本身不需要外部工具。
#   ffmpeg 只在**生成**素材与基准时用得到，CI 完全用不上。
#
# 【测试也不需要下载素材】
#   testdata/ 已入库（合成信号生成，无版权问题）。
#   musics/ 下的第三方版权歌曲不入库，依赖它们的"长时运行"用例会打印
#   提示并跳过（见 src/test/long_run_test.cj 文件头），不会判失败。
#
# 【平台覆盖的取舍】
#   本工作流覆盖 M6 要求的三平台。若要加 Linux arm64（ubuntu-24.04-arm），
#   复制 linux-x64 的 job 并把 setup-cangjie 的 os 改为 linux-arm64 即可 ——
#   install.sh 的内置表已含该平台的下载源与 SHA。
# ------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'testdata/**'
      - 'cjpm.toml'
      - 'cjpm.lock'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'testdata/**'
      - 'cjpm.toml'
      - 'cjpm.lock'
      - '.gitattributes'
      - '.github/workflows/ci.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  # 与 cjpm.toml 的 cjc-version = "1.1.0" 保持一致。
  # 注意二者含义不同：cjpm.toml 声明的是**最低支持版本**，
  # 这里用的是 CI 实际验证的版本。当前两者相同，故无需额外的"最低版本门禁"。
  # （2026-10-10 由 1.2.0 降到 1.1.0：中心仓审核侧的工具链更可能是 1.1.0，
  #   且已实测本库在 1.1.0 下 build / cjlint / 全量测试均通过；
  #   性能门槛随之按"最低声明 SDK"重校准为 150×。）
  CANGJIE_VERSION: "1.1.0"

jobs:
  # ============================================================
  # Linux x86_64
  # ============================================================
  linux-x64:
    name: Linux x64
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: 缓存 cjpm 构建产物
        uses: actions/cache@v6
        with:
          path: target/release
          key: ci-linux-${{ env.CANGJIE_VERSION }}-${{ hashFiles('cjpm.toml', 'cjpm.lock', 'src/**/*.cj') }}
          restore-keys: |
            ci-linux-${{ env.CANGJIE_VERSION }}-

      - name: 安装仓颉 SDK ${{ env.CANGJIE_VERSION }}
        uses: ./.github/actions/setup-cangjie
        with:
          os: linux
          version: ${{ env.CANGJIE_VERSION }}
          url-override: ${{ vars.CANGJIE_SDK_URL_LINUX }}

      # 版本信息先打出来：三平台里某个失败时，第一件要确认的往往是
      # "是不是 SDK 或编译器不对"，而不是去猜代码问题
      - name: 打印工具链版本
        run: |
          cjc --version
          cjpm --version

      # 这里曾有一段关于"必须先 build 后 check"的说明：根因是 [ffi.c] 在配置解析
      # 阶段校验 C 静态库是否存在、却不触发构建脚本，故两者有先后要求。
      # C 依赖整体移除后 [ffi.c] 已不存在，这条约束随之消失 ——
      # 下面的顺序（build → check → test）只是习惯，不再有强制含义。
      - name: cjpm build
        run: cjpm build

      - name: 确认无 C 依赖残留
        run: |
          test ! -e third-party && test ! -e build.cj
          echo "third-party/ 与 build.cj 均已随 C 依赖移除 ✓"

      - name: cjpm check
        run: cjpm check

      - name: cjpm test
        run: cjpm test --timeout-each 300s

      # 示例工程是**独立模块**（有自己的 cjpm.toml），必须单独构建。
      # 纳入 CI 是为了让它不能悄悄腐烂 —— 库的 API 一变，示例就会红。
      # 只在 Linux 上做：示例本身与平台无关，跑一遍即可。
      - name: 构建并运行示例工程
        run: |
          cd examples
          cjpm build
          cjpm run -- ../testdata/flac/flac_s16_44100_stereo.flac
          cjpm run -- ../testdata/flac/flac_tagged.flac tags
          cjpm run -- ../testdata/flac/flac_s16_44100_stereo.flac async
          cjpm run -- ../testdata/flac/flac_s16_44100_stereo.flac info

          # verify 是**可判定**的守卫：它对三种格式断言「声明帧数 vs 实际解出帧数」
          # （MP3 走有损口径、WAV/FLAC 走无损严格相等口径）。
          # 【为什么断言的是输出而不是退出码】`cjpm run` 不会透传程序的退出码
          # （实测恒为 0），所以只能检查输出里的结论行 —— 直接运行可执行文件时
          # 退出码才是有效的（不通过为 1）。
          for f in \
            ../testdata/mp3/mp3_cbr_128k.mp3 \
            ../testdata/wav/wav_s16_44100_stereo.wav \
            ../testdata/flac/flac_s16_44100_stereo.flac
          do
            out=$(cjpm run -- "$f" verify)
            echo "$out"
            if echo "$out" | grep -q "不通过"; then
              echo "::error::verify 不通过：$f"
              exit 1
            fi
            echo "$out" | grep -q "结论" || {
              echo "::error::verify 缺少结论行：$f"
              exit 1
            }
          done

  # ============================================================
  # Windows x86_64
  # ============================================================
  windows-x64:
    name: Windows x64
    timeout-minutes: 40
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: 缓存 cjpm 构建产物
        uses: actions/cache@v6
        with:
          path: target/release
          key: ci-windows-${{ env.CANGJIE_VERSION }}-${{ hashFiles('cjpm.toml', 'cjpm.lock', 'src/**/*.cj') }}
          restore-keys: |
            ci-windows-${{ env.CANGJIE_VERSION }}-

      - name: 安装仓颉 SDK ${{ env.CANGJIE_VERSION }}
        uses: ./.github/actions/setup-cangjie
        with:
          os: windows
          version: ${{ env.CANGJIE_VERSION }}
          url-override: ${{ vars.CANGJIE_SDK_URL_WINDOWS }}

      # Windows 侧同样不需要任何 C 工具链（纯仓颉实现，三个平台一致）。
      - name: 打印工具链版本
        run: |
          cjc --version
          cjpm --version

      # 与其它平台保持相同顺序，只为三平台步骤一致、便于比对。
      - name: cjpm build
        run: cjpm build

      - name: 确认无 C 依赖残留
        run: |
          if (Test-Path third-party) { throw "third-party/ 仍存在" }
          if (Test-Path build.cj) { throw "build.cj 仍存在" }
          Write-Output "third-party/ 与 build.cj 均已随 C 依赖移除"

      - name: cjpm check
        run: cjpm check

      - name: cjpm test
        run: cjpm test --timeout-each 300s

  # ============================================================
  # macOS Apple Silicon (arm64)
  # ============================================================
  macos-arm64:
    name: macOS arm64
    timeout-minutes: 40
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: 缓存 cjpm 构建产物
        uses: actions/cache@v6
        with:
          path: target/release
          key: ci-macos-arm64-${{ env.CANGJIE_VERSION }}-${{ hashFiles('cjpm.toml', 'cjpm.lock', 'src/**/*.cj') }}
          restore-keys: |
            ci-macos-arm64-${{ env.CANGJIE_VERSION }}-

      - name: 安装仓颉 SDK ${{ env.CANGJIE_VERSION }}
        uses: ./.github/actions/setup-cangjie
        with:
          os: macos
          version: ${{ env.CANGJIE_VERSION }}
          url-override: ${{ vars.CANGJIE_SDK_URL_MACOS }}
          sha-override: ${{ vars.CANGJIE_SDK_SHA_MACOS }}

      # 仓颉链接器 ld64.lld 默认 -syslibroot '/'，需 SDKROOT 定位 macOS 系统库
      - name: 探测 macOS SDK 路径
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: 打印工具链版本
        run: |
          cjc --version
          cjpm --version

      # 同 Linux job：macOS 也没有预置产物，build 必须先于 check
      - name: cjpm build
        env:
          SDKROOT: ${{ env.SDKROOT }}
        run: cjpm build

      - name: 确认无 C 依赖残留
        run: |
          test ! -e third-party && test ! -e build.cj
          echo "third-party/ 与 build.cj 均已随 C 依赖移除 ✓"

      - name: cjpm check
        run: cjpm check

      - name: cjpm test
        env:
          SDKROOT: ${{ env.SDKROOT }}
        run: cjpm test --timeout-each 300s
