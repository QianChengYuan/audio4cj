# ============================================================
# CodeQL 扫描范围配置
# ------------------------------------------------------------
# 【为什么需要这个文件】
#   CodeQL 的 init 步骤**不接受 paths 参数**（传了会被静默忽略），
#   扫描范围由仓库结构决定。而本仓库有两类不该被扫描的内容：
#   二进制测试素材，以及历史留痕与构建产物。
#   用 paths-ignore 明确排除，扫描结果才只剩**自己代码的问题**。
#
# 【曾经还排除过 third-party/dr_libs/**】
#   那是约 1.1 MB 的第三方单头文件 C 库（dr_flac.h / dr_wav.h / dr_mp3.h），
#   不是本项目代码、即使报出问题也无权修改，而海量告警会掩盖真正的问题。
#   随着 C 依赖整体移除，那些文件与"本项目自己写的 C 侧薄封装"
#   （third-party/drlibs_wrapper.c）都已不存在，扫描范围里也不再需要提及它们。
# ============================================================

name: audio4cj CodeQL 配置

paths-ignore:
  # 二进制测试素材与 golden 基准
  - testdata/**

  # M0 阶段的历史验证代码（保留留痕，不维护）
  - m0-poc/**

  # 构建产物
  - target/**
  - build-script-cache/**
  - libs/**
