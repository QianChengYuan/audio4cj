# ============================================================
# CodeQL 扫描范围配置
# ------------------------------------------------------------
# 【为什么需要这个文件】
#   CodeQL 的 init 步骤**不接受 paths 参数**（传了会被静默忽略），
#   扫描范围由仓库结构决定。而本仓库有两类不该被扫描的内容：
#   内置的第三方单头文件库，以及二进制测试素材。
#   用 paths-ignore 明确排除，扫描结果才只剩**自己代码的问题**。
#
# 【为什么 dr_libs 要排除】
#   third-party/dr_libs/ 下是约 1.1 MB 的第三方单头文件实现
#   （dr_flac.h / dr_wav.h / dr_mp3.h）。它们不是本项目的代码：
#   即使报出问题也无权修改，而海量告警会掩盖真正属于本项目的问题。
#
#   注意：**third-party/drlibs_wrapper.c 不在排除列表中** ——
#   它是本项目自己写的 C 侧薄封装，正是 FFI 边界的攻击面所在，
#   必须扫描。
# ============================================================

name: audio4cj CodeQL 配置

paths-ignore:
  # 内置的第三方单头文件库（不是本项目代码）
  - third-party/dr_libs/**

  # 二进制测试素材与 golden 基准
  - testdata/**

  # M0 阶段的历史验证代码（保留留痕，不维护）
  - m0-poc/**

  # 构建产物
  - target/**
  - build-script-cache/**
  - libs/**
